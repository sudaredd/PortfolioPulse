services:
  postgres:
    image: postgres:16-alpine
    container_name: portfoliopulse-postgres
    environment:
      POSTGRES_DB: portfoliopulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d portfoliopulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:4.1
    container_name: portfoliopulse-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: PulseCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  cassandra_data:
